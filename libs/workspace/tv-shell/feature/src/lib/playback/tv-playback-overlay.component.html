@if (isFrameCopyEngine()) {
    <lib-tv-frame-copy-engine
        [streamUrl]="streamUrl()"
        [resumeSeconds]="resumeSeconds()"
        [isLive]="isLive()"
        [mediaTitle]="mediaTitle()"
        [isOverlayActive]="isOverlayActive()"
        (playbackProgress)="onPlaybackProgress($event)"
        (channelChangeRequested)="onChannelChangeRequested($event)"
        (openChannelBarRequested)="onOpenChannelBarRequested()"
        (overlayBackRequested)="onOverlayBackRequested()"
        (exited)="onExited()"
    ></lib-tv-frame-copy-engine>
} @else {
    <lib-tv-web-engine
        [streamUrl]="streamUrl()"
        [resumeSeconds]="resumeSeconds()"
        [isLive]="isLive()"
        [mediaTitle]="mediaTitle()"
        [isOverlayActive]="isOverlayActive()"
        (playbackProgress)="onPlaybackProgress($event)"
        (channelChangeRequested)="onChannelChangeRequested($event)"
        (openChannelBarRequested)="onOpenChannelBarRequested()"
        (overlayBackRequested)="onOverlayBackRequested()"
        (exited)="onExited()"
    ></lib-tv-web-engine>
}
<span class="tv-playback-overlay__engine-badge">{{ engineLabelKey() | translate }}</span>
