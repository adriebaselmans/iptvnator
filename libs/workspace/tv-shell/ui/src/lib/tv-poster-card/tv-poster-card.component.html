<div class="tv-poster-card__box">
    @if (posterUrl() && !imageFailed()) {
        <img
            class="tv-poster-card__image"
            [src]="posterUrl()"
            [alt]="title()"
            loading="lazy"
            (error)="onImageError()"
        />
    } @else {
        <div
            class="tv-poster-card__placeholder"
            [class.tv-poster-card__placeholder--series]="kind() === 'series'"
            aria-hidden="true"
        ></div>
    }
</div>
<div class="tv-poster-card__title">{{ title() }}</div>
